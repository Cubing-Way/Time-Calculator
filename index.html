<html>
    <head>
        <title>Time Calculator</title>
        <style>
            input {
                width: 50px;
            }
        </style>
    </head>
    <body>

        <!-- First time input -->
        <input id = "hours1"> <span> :</span>
        <input id = "minutes1"> <span> :</span>
        <input id = "seconds1">

        <!-- Operation options -->
        <select id = "operation">
            <option value="sum">+</option>
            <option value="diff">-</option>
            <option value="mult">*</option>
            <option value="div">/</option>
        </select>

        <!-- Second time input -->
        <input id = "hours2"> <span> :</span>
        <input id = "minutes2"> <span> :</span>
        <input id = "seconds2">

        <!-- Result time calculated -->
        <button id = "resultBtn">=</button>
        <P id = "result"> </P>

        <!-- Keyboard -->
        <div id = "keyboard">

            <!-- Num Inputs-->
            <button id = "btn1">1</button>
            <button id = "btn2">2</button>
            <button id = "btn3">3</button>
            <button id = "btn4">4</button>
            <button id = "btn5">5</button>
            <button id = "btn6">6</button>
            <button id = "btn7">7</button>
            <button id = "btn8">8</button>
            <button id = "btn9">9</button>
            <button id = "btn0">0</button>

            <!-- Unit Inputs-->
            <button id = "hour">hours</button>
            <button id = "minute">minutes</button>
            <button id = "second">seconds</button>

            <br> <!-- Skip a line-->

            <!-- Confirm button -->
            <button id = "okBtn">Ok</button>
        </div>

        <!-- Scripts -->
        <script src = "main.js"></script>
        <script src = "keyboard.js"></script>
    </body>
</html>
