<html>
    <head>
        <title>Time Calculator</title>
        <style>
            input {
                width: 50px;
            }
        </style>
    </head>
    <body>

        <!-- First time input -->
        <input id = "hours1"> <span> :</span>
        <input id = "minutes1"> <span> :</span>
        <input id = "seconds1"> <span> hours</span>

        <!-- Operation options -->
        <select id = "operation">
            <option value="sum">+</option>
            <option value="diff">-</option>
        </select>

        <!-- Second time input -->
        <input id = "hours2"> <span> :</span>
        <input id = "minutes2"> <span> :</span>
        <input id = "seconds2"> <span> hours</span>

        <!-- Result time calculated -->
        <button id = "resultBtn">=</button>
        <P id = "result"> </P>

        <!-- Script -->
        <script src = "main.js"></script>
    </body>
</html>
